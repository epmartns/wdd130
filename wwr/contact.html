<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dry Oar - Contact Us</title>
    <meta name="description"
      content="Rafting Company Contact Us page - Make your questions or suggestions for us.">
    <meta name="author" content="Elias Martins">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Dry Oar - Logo" width="50">
        <nav>
            <ul class="list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="info">
            <h1> Dry Oar Rafting Group</h1>
            <p>8922 Thor Hammer Street</p>
            <p>Fla, Norway</p>
            <p>+47 40 02 89 22</p>
            <p>contact@dryoar.com</p>
        </div>
        <div class="contact">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1703.7717510756024!2d9.460321882371753!3d60.43766856466646!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sbr!4v1791028644149!5m2!1sen!2sbr"
                  width="400" height="400" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>
                <fieldset>
                    <legend>Contact Us</legend>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" required>
                    <label for="usermail">Email</label>
                    <input type="email" name="usermail" id="usermail">
                    <p>Message Purpose</p>
                    <label>
                        <input type="radio" name="purpose" id="general">
                        General Inquiry
                    </label>
                    <label>
                        <input type="radio" name="purpose" id="general">
                        Reservation Question
                    </label>
                    <label>
                        <input type="radio" name="purpose" id="general">
                        Website Suggestion
                    </label>
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type here..."></textarea>
                    <div class="check">
                        <input type="checkbox" name="newsletter" id="newsletter">
                        <label for="newsletter">Please Subscribe me for the monthly
                            newsletter</label>
                    </div>
                    <button type="submit">Get in Touch!</button>
                </fieldset>
            </form>
        </div>
        <divsection class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/emp1.jpg" alt="Luke Aelthinson">
                <figcaption>Luke Aelfinson - Finance</figcaption>
            </figure>
            <figure>
                <img src="images/emp2.jpg" alt="Mary Stephenson">
                <figcaption>Mary Stephenson - Management</figcaption>
            </figure>
            <figure>
                <img src="images/emp3.jpg" alt="Dale Svenson">
                <figcaption>Dale Svenson - Marketing</figcaption>
            </figure>
        </divsection>
    </main>
    <footer>
        <p>©️2026 | Dry Oar | Elias Martins</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook icon.">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn icon.">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram icon.">
            </a>
        </nav>
    </footer>
</body>

</html>
